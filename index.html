<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Quest - 2D Platformer</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:Arial,sans-serif}
body{display:flex;align-items:center;justify-content:center}
#game{position:relative;width:100vw;height:100vh;overflow:hidden;background:#5fb9f0}
canvas{display:block;width:100%;height:100%}
#start{
 position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
 background:linear-gradient(#0008,#000b);color:white;text-align:center;z-index:5
}
.panel{padding:35px 45px;border:2px solid #ffffff55;border-radius:20px;background:#101522dd;box-shadow:0 20px 60px #0008}
h1{font-size:clamp(42px,7vw,78px);margin:0 0 10px;color:#ffd72f}
p{font-size:18px;line-height:1.5}
button{border:0;border-radius:12px;padding:14px 28px;font-size:18px;font-weight:bold;cursor:pointer;background:#ffd72f;color:#171717}
button:hover{transform:translateY(-2px)}
#touch{display:none;position:absolute;bottom:20px;left:20px;right:20px;z-index:4;justify-content:space-between;pointer-events:none}
.pad{display:flex;gap:10px}
.touchbtn{width:64px;height:64px;border-radius:18px;border:1px solid #fff5;background:#1118;color:#fff;font-size:25px;pointer-events:auto}
@media(max-width:800px){#touch{display:flex}.panel{padding:25px}}
</style>
</head>
<body>
<div id="game">
<canvas id="canvas"></canvas>

<div id="start">
 <div class="panel">
  <h1>PIXEL QUEST</h1>
  <p>Explore the world • Collect coins • Defeat enemies • Reach the flag</p>
  <p><b>A/D</b> or <b>←/→</b> Move &nbsp; <b>SPACE</b> Jump &nbsp; <b>P</b> Pause</p>
  <button id="startBtn">START GAME</button>
 </div>
</div>

<div id="touch">
 <div class="pad">
  <button class="touchbtn" data-key="left">◀</button>
  <button class="touchbtn" data-key="right">▶</button>
 </div>
 <button class="touchbtn" data-key="jump">▲</button>
</div>
</div>

<script>
"use strict";

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const startScreen=document.getElementById("start");
const startBtn=document.getElementById("startBtn");

let W=innerWidth,H=innerHeight,DPR=Math.min(devicePixelRatio||1,2);
function resize(){
 W=innerWidth; H=innerHeight;
 canvas.width=Math.floor(W*DPR); canvas.height=Math.floor(H*DPR);
 canvas.style.width=W+"px"; canvas.style.height=H+"px";
 ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener("resize",resize); resize();

const WORLD=6000, GRAVITY=0.72;
let camera=0,state="menu",last=0;
const keys={left:false,right:false,jump:false};

const platforms=[
 [0,520,900,80],[1050,520,700,80],[1850,520,900,80],
 [2900,520,850,80],[4000,520,2000,80],
 [330,420,210,24],[650,340,190,24],[1130,415,210,24],
 [1450,325,210,24],[1940,415,190,24],[2240,335,230,24],
 [2550,425,160,24],[3050,395,210,24],[3390,315,210,24],
 [3650,415,190,24],[4150,395,210,24],[4490,315,230,24],
 [4950,410,220,24],[5350,340,220,24]
].map(a=>({x:a[0],y:a[1],w:a[2],h:a[3]}));

const goal={x:5750,y:420,w:12,h:100};

let player,enemies,coins,particles;

function resetGame(){
 player={
  x:100,y:450,w:42,h:58,vx:0,vy:0,
  speed:.65,maxSpeed:7,jump:-14,onGround:false,
  health:3,score:0,inv:0
 };
 enemies=[
  enemy(500,478,350,850),enemy(1200,373,1130,1340),
  enemy(1980,373,1900,2140),enemy(2320,293,2240,2470),
  enemy(3100,353,3000,3260),enemy(4200,353,4100,4350),
  enemy(5000,478,4750,5400)
 ];
 coins=[
  coin(400,380),coin(700,300),coin(1200,370),coin(1500,275),
  coin(2000,365),coin(2300,285),coin(2600,375),coin(3100,345),
  coin(3450,265),coin(3700,365),coin(4200,345),coin(4600,265),
  coin(5000,360),coin(5400,290),coin(5650,470)
 ];
 particles=[]; camera=0;
}
function enemy(x,y,left,right){return{x,y,w:42,h:42,left,right,vx:2,alive:true}}
function coin(x,y){return{x,y,r:12,collected:false,phase:Math.random()*6.28}}

function rects(a,b){
 return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
}

function damage(dir){
 if(player.inv>0)return;
 player.health--; player.inv=90;
 player.vx=-7*dir; player.vy=-7;
 if(player.health<=0)state="gameover";
}

function spawn(x,y,n=12){
 for(let i=0;i<n;i++)particles.push({
  x,y,vx:(Math.random()-.5)*6,vy:-Math.random()*5-1,
  life:25+Math.random()*20,size:3+Math.random()*4
 });
}

function update(dt){
 const f=Math.min(dt/16.67,2);

 if(keys.left)player.vx-=player.speed*f;
 if(keys.right)player.vx+=player.speed*f;
 if(!keys.left&&!keys.right)player.vx*=Math.pow(.80,f);
 player.vx=Math.max(-player.maxSpeed,Math.min(player.maxSpeed,player.vx));

 // Horizontal movement + collision
 player.x+=player.vx*f;
 let r={x:player.x,y:player.y,w:player.w,h:player.h};
 for(const p of platforms){
  if(rects(r,p)){
   if(player.vx>0)player.x=p.x-player.w;
   else if(player.vx<0)player.x=p.x+p.w;
   r={x:player.x,y:player.y,w:player.w,h:player.h};
  }
 }
 player.x=Math.max(0,Math.min(WORLD-player.w,player.x));

 // Vertical movement + collision
 const oldBottom=player.y+player.h;
 const oldTop=player.y;
 player.vy+=GRAVITY*f;
 player.vy=Math.min(player.vy,18);
 player.y+=player.vy*f;
 player.onGround=false;
 r={x:player.x,y:player.y,w:player.w,h:player.h};

 for(const p of platforms){
  if(!rects(r,p))continue;
  if(player.vy>=0&&oldBottom<=p.y+4){
   player.y=p.y-player.h;player.vy=0;player.onGround=true;
  }else if(player.vy<0&&oldTop>=p.y+p.h-4){
   player.y=p.y+p.h;player.vy=0;
  }
  r={x:player.x,y:player.y,w:player.w,h:player.h};
 }

 if(player.inv>0)player.inv-=f;

 if(player.y>H+180){
  damage(1);
  if(state==="playing"){player.x=Math.max(100,player.x-300);player.y=300;player.vy=0}
 }

 for(const e of enemies){
  if(!e.alive)continue;
  e.x+=e.vx*f;
  if(e.x<=e.left){e.x=e.left;e.vx=Math.abs(e.vx)}
  if(e.x+e.w>=e.right){e.x=e.right-e.w;e.vx=-Math.abs(e.vx)}
  if(rects(player,e)){
   if(player.vy>0&&player.y+player.h-player.vy*f<=e.y+10){
    e.alive=false;player.vy=-10;player.score+=100;spawn(e.x+e.w/2,e.y+e.h/2);
   }else{
    damage(player.x<e.x?1:-1);
   }
  }
 }

 for(const c of coins){
  if(c.collected)continue;
  c.phase+=.09*f;
  if(rects(player,{x:c.x-c.r,y:c.y-c.r,w:c.r*2,h:c.r*2})){
   c.collected=true;player.score+=10;spawn(c.x,c.y,8);
  }
 }

 for(let i=particles.length-1;i>=0;i--){
  const q=particles[i];q.x+=q.vx*f;q.y+=q.vy*f;q.vy+=.2*f;q.life-=f;
  if(q.life<=0)particles.splice(i,1);
 }

 if(rects(player,goal))state="won";

 const target=player.x-W*.4;
 camera+=(target-camera)*.1*f;
 camera=Math.max(0,Math.min(WORLD-W, camera));
}

function sky(){
 const g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,"#65c2f4");g.addColorStop(1,"#bcecff");
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

 // sun
 ctx.fillStyle="#ffe66b";ctx.beginPath();ctx.arc(W-130,90,45,0,Math.PI*2);ctx.fill();

 // parallax mountains
 ctx.fillStyle="#4a9b57";
 for(let x=-600;x<W+700;x+=500){
  const bx=x-camera*.35;
  ctx.beginPath();ctx.moveTo(bx,520);ctx.lineTo(bx+250,280);ctx.lineTo(bx+500,520);ctx.closePath();ctx.fill();
 }
 // clouds
 ctx.fillStyle="#fff";
 for(const c of [[200,100],[650,150],[1100,80],[1700,125],[2500,90],[3500,140],[4500,90],[5400,150]]){
  const x=c[0]-camera*.2,y=c[1];
  ctx.beginPath();ctx.arc(x,y,28,0,Math.PI*2);ctx.arc(x+35,y-10,34,0,Math.PI*2);ctx.arc(x+70,y,27,0,Math.PI*2);ctx.fill();
 }
}

function draw(){
 sky();

 // platforms
 for(const p of platforms){
  const x=p.x-camera;
  ctx.fillStyle="#7b4a2c";ctx.fillRect(x,p.y,p.w,p.h);
  ctx.fillStyle="#3caf4c";ctx.fillRect(x,p.y,p.w,8);
 }

 // goal
 let gx=goal.x-camera;
 ctx.fillStyle="#222";ctx.fillRect(gx,goal.y,8,goal.h);
 ctx.fillStyle="#a04ddd";
 ctx.beginPath();ctx.moveTo(gx+8,goal.y);ctx.lineTo(gx+68,goal.y+20);ctx.lineTo(gx+8,goal.y+42);ctx.closePath();ctx.fill();

 // coins
 for(const c of coins){
  if(c.collected)continue;
  const bob=Math.sin(c.phase)*4,x=c.x-camera;
  ctx.fillStyle="#ffd72f";ctx.beginPath();ctx.arc(x,c.y+bob,c.r,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#fff6a0";ctx.beginPath();ctx.arc(x-3,c.y+bob-4,3,0,Math.PI*2);ctx.fill();
 }

 // enemies
 for(const e of enemies){
  if(!e.alive)continue;
  const x=e.x-camera,y=e.y;
  ctx.fillStyle="#dc3c45";ctx.fillRect(x,y+10,e.w,32);
  ctx.beginPath();ctx.arc(x+21,y+13,17,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(x+14,y+11,5,0,Math.PI*2);ctx.arc(x+28,y+11,5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#222";ctx.beginPath();ctx.arc(x+14,y+11,2,0,Math.PI*2);ctx.arc(x+28,y+11,2,0,Math.PI*2);ctx.fill();
 }

 // particles
 for(const q of particles){
  ctx.globalAlpha=Math.max(0,q.life/40);ctx.fillStyle="#ffd72f";
  ctx.beginPath();ctx.arc(q.x-camera,q.y,q.size,0,Math.PI*2);ctx.fill();
 }
 ctx.globalAlpha=1;

 // player
 if(!(player.inv>0&&Math.floor(player.inv/6)%2===0)){
  const x=player.x-camera,y=player.y;
  ctx.fillStyle="#326bdc";roundRect(x,y+16,player.w,42,8,true);
  ctx.fillStyle="#ffc896";ctx.beginPath();ctx.arc(x+21,y+15,17,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#222";roundRect(x+7,y-1,28,10,4,true);
  ctx.beginPath();ctx.arc(x+15,y+13,3,0,Math.PI*2);ctx.arc(x+27,y+13,3,0,Math.PI*2);ctx.fill();
 }

 // HUD
 ctx.fillStyle="#0009";roundRect(14,14,245,82,12,true);
 ctx.fillStyle="#fff";ctx.font="bold 24px Arial";
 ctx.fillText("❤ ".repeat(Math.max(0,player.health)),25,43);
 ctx.fillText("Score: "+player.score,25,76);
 ctx.font="16px Arial";
 ctx.fillText("A/D or ←/→ • SPACE jump • P pause",20,H-20);

 if(state==="paused")overlay("PAUSED","Press P to continue");
 if(state==="gameover")overlay("GAME OVER","Press R to restart");
 if(state==="won")overlay("LEVEL COMPLETE!","Score: "+player.score+"  •  Press R to play again");
}

function roundRect(x,y,w,h,r,fill){
 ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill)ctx.fill();else ctx.stroke();
}
function overlay(title,sub){
 ctx.fillStyle="#000a";ctx.fillRect(0,0,W,H);
 ctx.fillStyle="#fff";ctx.font="bold "+Math.min(70,W/10)+"px Arial";
 ctx.textAlign="center";ctx.fillText(title,W/2,H/2-30);
 ctx.font="22px Arial";ctx.fillText(sub,W/2,H/2+25);ctx.textAlign="left";
}

function jump(){
 if(state==="playing"&&player.onGround){player.vy=player.jump}
}

addEventListener("keydown",e=>{
 if(["ArrowLeft","ArrowRight","ArrowUp","Space"].includes(e.code))e.preventDefault();
 if(e.code==="ArrowLeft"||e.code==="KeyA")keys.left=true;
 if(e.code==="ArrowRight"||e.code==="KeyD")keys.right=true;
 if(e.code==="Space"||e.code==="ArrowUp")jump();
 if(e.code==="KeyP"&&!e.repeat){
  if(state==="playing")state="paused";else if(state==="paused")state="playing";
 }
 if(e.code==="KeyR"&&!e.repeat&&(state==="gameover"||state==="won")){
  resetGame();state="playing";
 }
});
addEventListener("keyup",e=>{
 if(e.code==="ArrowLeft"||e.code==="KeyA")keys.left=false;
 if(e.code==="ArrowRight"||e.code==="KeyD")keys.right=false;
});

document.querySelectorAll(".touchbtn").forEach(b=>{
 const k=b.dataset.key;
 const on=e=>{e.preventDefault();if(k==="jump")jump();else keys[k]=true};
 const off=e=>{e.preventDefault();if(k!=="jump")keys[k]=false};
 b.addEventListener("pointerdown",on);b.addEventListener("pointerup",off);
 b.addEventListener("pointercancel",off);b.addEventListener("pointerleave",off);
});

startBtn.onclick=()=>{
 resetGame();state="playing";startScreen.style.display="none";
};

resetGame();

function loop(t){
 const dt=Math.min(50,t-last||16.67);last=t;
 if(state==="playing")update(dt);
 draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
